<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">How SemBaker compiles semantic operators</title>
  <desc id="desc">SemBaker inspects each operator in a native semantic pipeline. Suitable operators are compiled once into cached Python and run locally; the rest stay on the engine's native path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090E1D"/><stop offset=".55" stop-color="#11152A"/><stop offset="1" stop-color="#1A102D"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/></linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".5"/></filter>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A78BFA"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34D399"/></marker>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F59E0B"/></marker>
    <style>
      .s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:"SFMono-Regular",Consolas,monospace}
      .h{font-size:34px;font-weight:700;fill:#F8FAFC}.ey{font-size:12px;font-weight:700;fill:#C4B5FD;letter-spacing:1.5px}
      .t{font-size:18px;font-weight:700;fill:#F8FAFC}.b{font-size:13px;fill:#CBD5E1}.sm{font-size:11px;fill:#94A3B8}
      .code{font-size:13px;fill:#E2E8F0}.chip{font-size:11px;font-weight:700;fill:#EDE9FE}.metric{font-size:14px;font-weight:700;fill:#F8FAFC}
    </style>
  </defs>
  <rect width="1440" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="-70" r="310" fill="#7C3AED" opacity=".09"/><circle cx="120" cy="730" r="250" fill="#0891B2" opacity=".07"/>
  <text x="70" y="49" class="s ey">SEMANTIC OPERATORS, BAKED ONCE</text>
  <text x="70" y="91" class="s h">Keep the native pipeline. Move the LLM out of the data loop.</text>
  <path d="M70 112H1370" stroke="#334155" opacity=".6"/>

  <!-- User pipeline -->
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="300" height="350" rx="22" fill="#121A2E" stroke="#334155"/>
    <rect x="70" y="150" width="300" height="54" rx="22" fill="#182238"/><path d="M70 180v24h300v-24" fill="#182238"/>
    <circle cx="96" cy="177" r="5" fill="#FB7185"/><circle cx="114" cy="177" r="5" fill="#FBBF24"/><circle cx="132" cy="177" r="5" fill="#34D399"/>
    <text x="157" y="182" class="s sm">your_pipeline.py</text>
    <text x="94" y="240" class="m code"><tspan fill="#C4B5FD">plan</tspan> = engine.read(data)</text>
    <text x="94" y="269" class="m code">  .sem_filter(<tspan fill="#FDBA74">"positive"</tspan>)</text>
    <text x="94" y="298" class="m code">  .sem_map(<tspan fill="#FDBA74">"extract age"</tspan>)</text>
    <text x="94" y="327" class="m code">  .sem_join(<tspan fill="#FDBA74">"same entity"</tspan>)</text>
    <rect x="90" y="356" width="260" height="58" rx="12" fill="#25194A" stroke="#8B5CF6"/>
    <text x="108" y="391" class="m code"><tspan fill="#C4B5FD">sembaker</tspan>.optimize(plan)</text>
    <text x="94" y="455" class="m code">plan.run()</text><text x="94" y="481" class="s sm">One added line. Same engine API.</text>
  </g>
  <path d="M370 325H430" stroke="#A78BFA" stroke-width="3" marker-end="url(#p)"/><text x="391" y="309" class="s sm">plan</text>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="450" y="140" width="330" height="370" rx="26" fill="#15162C" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="466" y="156" width="298" height="88" rx="18" fill="url(#brand)"/>
    <path d="M492 210h38l-4 15h-30zM499 208c0-13 5-22 12-22s12 9 12 22M496 194h30" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <text x="548" y="191" class="s t">SemBaker</text><text x="548" y="217" class="s b" fill="#F5D0FE">per-operator optimizer</text>
    <text x="486" y="278" class="s ey">INSPECT EACH OPERATOR</text>
    <g><rect x="486" y="296" width="76" height="30" rx="15" fill="#2E2250"/><rect x="574" y="296" width="76" height="30" rx="15" fill="#2E2250"/><rect x="662" y="296" width="76" height="30" rx="15" fill="#2E2250"/>
      <text x="524" y="316" text-anchor="middle" class="s chip">FILTER</text><text x="612" y="316" text-anchor="middle" class="s chip">MAP</text><text x="700" y="316" text-anchor="middle" class="s chip">JOIN</text></g>
    <rect x="486" y="350" width="252" height="58" rx="13" fill="#1E293B" stroke="#475569"/><circle cx="514" cy="379" r="12" fill="#7C3AED"/>
    <path d="M508 379h12M514 373v12" stroke="#FFF" stroke-width="2"/><text x="537" y="375" class="s b">Will compilation amortize?</text><text x="537" y="395" class="s sm">cost × cardinality</text>
    <rect x="486" y="423" width="252" height="58" rx="13" fill="#1E293B" stroke="#475569"/><circle cx="514" cy="452" r="12" fill="#C026D3"/>
    <path d="M508 452l4 4 8-9" fill="none" stroke="#FFF" stroke-width="2.2"/><text x="537" y="448" class="s b">Can code preserve semantics?</text><text x="537" y="468" class="s sm">codifiability gate</text>
  </g>

  <!-- Routing -->
  <path d="M780 300h52v-65h35" fill="none" stroke="#34D399" stroke-width="3" marker-end="url(#g)"/>
  <path d="M780 400h52v59h35" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="796" y="251" width="52" height="22" rx="11" fill="#064E3B"/><text x="822" y="266" text-anchor="middle" class="s sm" fill="#A7F3D0">BAKE</text>
  <rect x="791" y="426" width="62" height="22" rx="11" fill="#4A2A08"/><text x="822" y="441" text-anchor="middle" class="s sm" fill="#FDE68A">NATIVE</text>

  <!-- Compiled branch -->
  <g filter="url(#shadow)">
    <rect x="875" y="135" width="350" height="230" rx="22" fill="#10231F" stroke="#10B981"/>
    <rect x="895" y="155" width="310" height="40" rx="11" fill="#0F766E"/><text x="915" y="181" class="s t">Compile once</text><text x="1183" y="180" text-anchor="end" class="s chip">1 LLM CALL</text>
    <rect x="895" y="215" width="133" height="78" rx="14" fill="#132E2A" stroke="#277A68"/><text x="962" y="238" text-anchor="middle" class="s sm">NATURAL LANGUAGE</text><text x="962" y="267" text-anchor="middle" class="m code">"positive"</text>
    <path d="M1034 254h29" stroke="#34D399" stroke-width="2.5" marker-end="url(#g)"/>
    <rect x="1071" y="215" width="134" height="78" rx="14" fill="#132E2A" stroke="#277A68"/><text x="1138" y="238" text-anchor="middle" class="s sm">CACHED PYTHON</text><text x="1138" y="263" text-anchor="middle" class="m code" fill="#86EFAC">compiled_filter</text><text x="1138" y="280" text-anchor="middle" class="m sm">row → bool</text>
    <rect x="895" y="312" width="310" height="35" rx="10" fill="#0B3B2E"/><text x="913" y="335" class="s metric">N local calls</text><text x="1187" y="335" text-anchor="end" class="s b" fill="#A7F3D0">µs / row · 0 tokens</text>
  </g>

  <!-- Native branch -->
  <g filter="url(#shadow)">
    <rect x="875" y="395" width="350" height="115" rx="20" fill="#2A2115" stroke="#B7791F"/>
    <text x="899" y="428" class="s t">Keep the native operator</text><text x="899" y="453" class="s b">Non-codifiable or too small to amortize</text>
    <rect x="899" y="470" width="302" height="27" rx="9" fill="#3B2A12"/><text x="916" y="489" class="s metric">N engine-managed LLM calls</text>
  </g>

  <!-- Output -->
  <path d="M1225 250h37v72h20" fill="none" stroke="#34D399" stroke-width="3" marker-end="url(#g)"/><path d="M1225 452h37v-76h20" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#shadow)"><rect x="1290" y="255" width="100" height="170" rx="21" fill="url(#out)"/><path d="M1318 288h46v86h-46z" fill="#FFF" opacity=".16"/><path d="M1326 305h30M1326 322h30M1326 339h30M1326 356h20" stroke="#FFF" stroke-width="3" stroke-linecap="round"/><circle cx="1362" cy="389" r="15" fill="#34D399"/><path d="M1355 389l5 5 9-11" fill="none" stroke="#052E27" stroke-width="3"/><text x="1340" y="413" text-anchor="middle" class="s metric">RESULT</text></g>

  <!-- Footer -->
  <rect x="70" y="563" width="1320" height="85" rx="20" fill="#10182A" stroke="#263247"/>
  <text x="96" y="596" class="s ey">PLUGS INTO THE ENGINE YOU ALREADY USE</text>
  <g class="s"><rect x="96" y="611" width="146" height="25" rx="12" fill="#202A40"/><text x="169" y="628" text-anchor="middle" class="b">Palimpzest</text><rect x="254" y="611" width="112" height="25" rx="12" fill="#202A40"/><text x="310" y="628" text-anchor="middle" class="b">LOTUS</text><rect x="378" y="611" width="124" height="25" rx="12" fill="#202A40"/><text x="440" y="628" text-anchor="middle" class="b">Nirvana</text><rect x="514" y="611" width="124" height="25" rx="12" fill="#202A40"/><text x="576" y="628" text-anchor="middle" class="b">DocETL</text></g>
  <text x="1364" y="597" text-anchor="end" class="s b">Unsupported operators stay native.</text><text x="1364" y="626" text-anchor="end" class="s sm">The original engine still owns execution.</text>
</svg>
