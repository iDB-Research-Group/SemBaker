[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sembaker"
version = "0.1.0"
description = "Compile-then-execute semantic operators: an external optimizer for Palimpzest, LOTUS, Nirvana, and DocETL"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Wenkai Dong", email = "dongw@hawaii.edu" },
    { name = "Yifan Wang", email = "yifanw@hawaii.edu" },
]
keywords = [
    "llm",
    "semantic-operators",
    "query-optimization",
    "compilation",
    "palimpzest",
    "lotus",
    "docetl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/iDB-Research-Group/SemBaker"
Repository = "https://github.com/iDB-Research-Group/SemBaker"
Issues = "https://github.com/iDB-Research-Group/SemBaker/issues"

[project.optional-dependencies]
# Engine adapters. Versions = what the adapters were developed/tested against.
pz = ["palimpzest>=1.5"]
lotus = ["lotus-ai>=1.1"]
nirvana = ["nirvana-ai>=1.3"]
docetl = ["docetl>=0.3"]
all = [
    "palimpzest>=1.5",
    "lotus-ai>=1.1",
    "nirvana-ai>=1.3",
    "docetl>=0.3",
]

[tool.setuptools.packages.find]
include = ["sembaker*"]
